
spring.application.name=workforceiq

# Database configuration
# Defaults are for local development; set DB_URL, DB_USERNAME, DB_PASSWORD for Aiven.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workforceiq}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HikariCP connection pool (tuned for Render free tier + Aiven MySQL) ───────
# Keep 2 idle connections warm so the first request after idle doesn't wait for
# a new TCP handshake to Aiven. max-lifetime < Aiven's wait_timeout (8 h).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Disable open-session-in-view to avoid unnecessary DB connections on each request
spring.jpa.open-in-view=false

# Server
server.port=${PORT:8080}

# ── GZIP compression for all API responses ────────────────────────────────────
# Typically saves 60-80 % on JSON payloads; free CPU is worth it on Render.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# CORS
# Default covers local dev + GitHub Pages production site.
# Override by setting CORS_ALLOWED_ORIGIN env var on Render.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:5500,http://127.0.0.1:5501,https://sriramkoppula.github.io}
