spring.application.name=workforceiq

# ─── Database (read from environment variables; fallback to local dev values) ───
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workforceiq}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:***REMOVED***}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning for cloud (Render free tier spins down; keep pool small)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
# 'update' creates missing tables; safe for new cloud DB.
# WARNING: never use 'create' or 'create-drop' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─── Server ────────────────────────────────────────────────────────────────────
# Render injects $PORT automatically; fallback to 8080 for local dev
server.port=${PORT:8080}

# ─── CORS allowed origin (set via env var in production) ───────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:5500,http://127.0.0.1:5501}