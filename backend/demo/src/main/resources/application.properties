
spring.application.name=workforceiq

# Database configuration
# Defaults are for local development; set DB_URL, DB_USERNAME, DB_PASSWORD for Aiven.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workforceiq}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven MySQL connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=${PORT:8080}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://127.0.0.1:5500,http://127.0.0.1:5501}
